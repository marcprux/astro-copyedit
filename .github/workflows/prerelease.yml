name: Prepare prerelease
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/check-release.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
  validate:
    needs: check-version
    uses: ./.github/workflows/ci.yml
  prerelease:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm pack
      - name: Create a prerelease for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json tagName > /dev/null 2>&1; then
            echo "Release already exists; leaving its state and assets unchanged."
          else
            gh release create "$RELEASE_TAG" astro-copyedit-*.tgz \
              --verify-tag --prerelease --latest=false \
              --title "$RELEASE_TAG" --generate-notes
          fi
